<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片标记工具 — 光伏组件 EL 点位标注</title>
<link rel="icon" type="image/png" sizes="131x96" href="images/favicon.png">
<link rel="icon" type="image/png" sizes="43x32" href="images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #eaf3fb;
  --bg2: #dcebf7;
  --panel: rgba(255, 255, 255, 0.94);
  --border: rgba(30, 58, 95, 0.10);
  --border2: rgba(30, 58, 95, 0.22);
  --text: #17314f;
  --text2: #47617f;
  --text3: #8ca2b8;
  --accent: #2f80ed;
  --accent2: #1d6fe0;
  --danger: #e24a4f;
}

html, body { height: 100%; }

body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  line-height: 1.5;
}

/* ===== 顶部工具栏 ===== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 8px 14px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  z-index: 20;
  flex-shrink: 0;
}
.toolbar .brand {
  display: flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 14px; margin-right: 6px; white-space: nowrap;
}
.brand .logo {
  width: 26px; height: 26px; border-radius: 7px;
  background: #fff; overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.brand .logo img { width: 100%; height: 100%; object-fit: contain; }
.tgroup {
  display: flex; align-items: center; gap: 4px;
  padding: 0 6px; border-right: 1px solid var(--border);
}
.tgroup:first-of-type { padding-left: 0; }
.tgroup:last-of-type { border-right: none; }

.tbtn {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: 1px solid var(--border); color: var(--text2);
  padding: 6px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 500;
  cursor: pointer; transition: all .15s; white-space: nowrap; font-family: inherit;
}
.tbtn:hover { border-color: var(--border2); color: var(--text); background: rgba(30,58,95,0.05); }
.tbtn:disabled { opacity: .4; cursor: not-allowed; }
.tbtn .ico { font-size: 14px; line-height: 1; }
.tbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tbtn.primary:hover { background: var(--accent2); }
.tbtn.danger:hover { border-color: var(--danger); color: var(--danger); }
.tbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.tbtn.off { color: var(--text3); }

/* 下拉菜单 */
.dropdown { position: relative; }
.dropdown-menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 300;
  min-width: 152px; background: var(--panel); border: 1px solid var(--border2);
  border-radius: 10px; padding: 4px; box-shadow: 0 8px 30px rgba(30,58,95,0.20);
  display: none;
}
.dropdown.open .dropdown-menu { display: block; }
.dropdown .caret { font-size: 9px; opacity: .55; margin-left: 2px; }
.ico-svg { width: 15px; height: 15px; flex-shrink: 0; }
.ctx-item svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 7px; }
.color-row .icon-btn svg { width: 13px; height: 13px; vertical-align: -1px; }
.dd-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: none; border: none; color: var(--text);
  padding: 8px 11px; text-align: left; border-radius: 7px; font-size: 13px;
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.dd-item:hover { background: rgba(30,58,95,0.07); }
.dd-item.active { background: rgba(47,128,237,0.14); color: var(--accent2); font-weight: 600; }
.dd-sub { position: relative; }
.dd-sub-trigger { cursor: default; }
.caret-r { margin-left: auto; font-size: 9px; opacity: .55; }
.dd-submenu {
  position: absolute; left: calc(100% + 2px); top: -4px; z-index: 310;
  min-width: 132px; background: var(--panel); border: 1px solid var(--border2);
  border-radius: 10px; padding: 4px; box-shadow: 0 8px 30px rgba(30,58,95,0.20);
  display: none;
}
.dd-sub:hover .dd-submenu { display: block; }
.tool-color { width: 30px; height: 30px; padding: 0; border: 1px solid var(--border2); border-radius: 6px; cursor: pointer; background: none; flex-shrink: 0; }

.slider-group {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text2); white-space: nowrap;
}
.slider-group input[type=range] { width: 88px; accent-color: var(--accent); cursor: pointer; }
.slider-group .val {
  min-width: 34px; text-align: right; color: var(--text);
  font-variant-numeric: tabular-nums;
}

.file-label {
  margin-left: auto; font-size: 12px; color: var(--text3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px;
}

/* ===== 主画布区 ===== */
.main { position: relative; flex: 1; overflow: hidden; }
#canvas { display: block; width: 100%; height: 100%; cursor: crosshair; will-change: transform; }
#overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
.main.panning #canvas { cursor: grab; }
.main.grab #canvas { cursor: grab; }
.main.dragging { outline: 2px dashed var(--accent); outline-offset: -6px; }

/* ===== 浮动面板 ===== */
.panel {
  position: absolute; top: 12px; width: 200px; max-height: calc(100% - 24px);
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 10; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 8px 30px rgba(30,58,95,0.16);
}
.color-panel { left: 12px; }
.stats-panel { right: 12px; }
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; font-size: 13px; font-weight: 600;
  cursor: pointer; user-select: none; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-head .chev { transition: transform .2s; color: var(--text3); }
.panel-head .ph-title { display: inline-flex; align-items: center; gap: 6px; }
.panel-head .pico { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; }
.panel.collapsed .panel-head .chev { transform: rotate(-90deg); }
.panel.collapsed .panel-head { border-bottom: none; }
.panel.collapsed { width: auto; }
.panel-body { padding: 10px 12px; overflow-y: auto; }
.panel.collapsed .panel-body { display: none; }

/* 颜色行 */
.color-row {
  display: flex; align-items: center; gap: 8px; padding: 5px 6px;
  border-radius: 8px; transition: background .12s;
}
.color-row:hover { background: rgba(30,58,95,0.05); }
.color-row.selected { background: rgba(59,130,246,0.14); outline: 1px solid var(--accent); }
.swatch-btn {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.35);
  cursor: pointer; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
  padding: 0;
}
.color-row .cname { flex: 1; font-size: 12px; color: var(--text2); }
.color-row .ccount {
  font-size: 11px; color: var(--text3); font-variant-numeric: tabular-nums;
  min-width: 18px; text-align: right;
}
.eye-btn { background: none; border: none; cursor: pointer; font-size: 13px; opacity: .8; padding: 2px; }
.eye-btn.off { opacity: .35; }
.color-row .cidx { width: 15px; font-size: 10px; color: var(--text3); flex-shrink: 0; text-align: right; font-variant-numeric: tabular-nums; }
.color-row .cname { cursor: pointer; }
.color-row .cname:hover { color: var(--text); text-decoration: underline dotted; }
.color-row .cname-edit { flex: 1; min-width: 0; background: var(--bg2); border: 1px solid var(--accent); color: var(--text); border-radius: 5px; padding: 2px 4px; font-size: 12px; font-family: inherit; }
.color-row .recolor { width: 22px; height: 18px; border: none; background: none; cursor: pointer; padding: 0; flex-shrink: 0; }
.color-row .icon-btn { background: none; border: none; cursor: pointer; font-size: 12px; padding: 1px; opacity: .7; flex-shrink: 0; line-height: 1; }
.color-row .icon-btn:hover { opacity: 1; }

.custom-color {
  display: flex; align-items: center; gap: 8px; margin-top: 10px;
  padding-top: 10px; border-top: 1px solid var(--border);
}
.custom-color input[type=color] {
  width: 32px; height: 24px; border: none; background: none; cursor: pointer; padding: 0;
}
.custom-color label { font-size: 11px; color: var(--text3); }

/* 统计面板 */
.stat-total {
  display: flex; align-items: baseline; gap: 6px;
  padding: 4px 6px 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
}
.stat-total .num { font-size: 26px; font-weight: 800; color: var(--text); }
.stat-total .lbl { font-size: 12px; color: var(--text2); }
.stat-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-size: 12px; }
.stat-row .swatch {
  width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.3);
}
.stat-row .cname { flex: 1; color: var(--text2); }
.stat-row .ccount { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-actions {
  display: flex; flex-direction: column; gap: 6px;
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
}
.stat-actions .tbtn { justify-content: center; }

/* 缩放徽标 */
.zoom-badge {
  position: absolute; left: 12px; bottom: 12px; padding: 4px 10px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  font-size: 12px; color: var(--text2); z-index: 5; pointer-events: none;
  font-variant-numeric: tabular-nums;
}

/* 空状态提示 */
.drop-hint {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  color: var(--text2); z-index: 6; cursor: pointer; text-align: center; padding: 20px;
}
.drop-hint.hidden { display: none; }
.drop-hint .big { font-size: 44px; }
.drop-hint .t1 { font-size: 16px; color: var(--text); font-weight: 600; }
.drop-hint .t2 { font-size: 13px; color: var(--text3); max-width: 460px; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: #17314f; border: 1px solid rgba(30,58,95,0.3); color: #fff;
  padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 100;
  opacity: 0; pointer-events: none; transition: all .25s; box-shadow: 0 8px 30px rgba(30,58,95,0.28);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 框区数量弹窗 */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center; z-index: 200;
}
.modal-box {
  background: var(--panel); border: 1px solid var(--border2); border-radius: 12px;
  padding: 18px 20px; width: 250px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 12px 40px rgba(30,58,95,0.22);
}
.modal-title { font-size: 14px; font-weight: 600; }
.modal-box input {
  background: var(--bg2); border: 1px solid var(--border2); color: var(--text);
  border-radius: 8px; padding: 8px 10px; font-size: 16px; width: 100%; font-family: inherit;
}
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* 右键菜单 */
.ctx-menu {
  position: fixed; z-index: 300; background: var(--panel); border: 1px solid var(--border2);
  border-radius: 10px; padding: 4px; min-width: 110px; box-shadow: 0 8px 30px rgba(30,58,95,0.22);
}
.ctx-item {
  display: block; width: 100%; background: none; border: none; color: var(--text);
  padding: 8px 12px; text-align: left; border-radius: 7px; font-size: 13px; cursor: pointer; font-family: inherit;
}
.ctx-item:hover { background: rgba(30,58,95,0.07); }
.ctx-size-row { display: flex; gap: 2px; padding: 0 4px; }
.ctx-size-row .ctx-item { flex: 1; text-align: center; }
.ctx-size-row .ctx-item.on { background: rgba(47,128,237,0.16); color: var(--accent2); font-weight: 600; }
.ctx-opacity-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.ctx-opacity-row label { font-size: 12px; color: var(--text); white-space: nowrap; }
.ctx-opacity-row input[type="range"] { flex: 1; min-width: 90px; }
.ctx-toolcolor-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.ctx-toolcolor-row label { font-size: 12px; color: var(--text); white-space: nowrap; }
.ctx-toolcolor-row input[type="color"] { width: 28px; height: 24px; padding: 0; border: 1px solid rgba(0,0,0,0.25); border-radius: 6px; cursor: pointer; background: none; }
.ctx-sep { height: 1px; background: var(--border); margin: 4px 6px; }
.ctx-colors { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; max-width: 172px; }
.ctx-swatch {
  width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.25);
  cursor: pointer; padding: 0; flex: 0 0 auto;
}
.ctx-swatch:hover { outline: 2px solid var(--accent); }
.hover-tip {
  position: fixed; z-index: 250; pointer-events: none; display: none;
  background: #17314f; border: 1px solid rgba(30,58,95,0.3); color: #fff;
  padding: 5px 9px; border-radius: 7px; font-size: 12px; white-space: nowrap;
  box-shadow: 0 4px 16px rgba(30,58,95,0.28); transform: translate(14px, 14px);
}

.loading-overlay {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: rgba(234, 243, 251, 0.72);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
.loading-overlay .spinner {
  width: 44px; height: 44px;
  border: 4px solid rgba(30, 58, 95, 0.18);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.loading-overlay .loading-text { font-size: 14px; color: var(--text); font-weight: 600; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 760px) {
  .panel { width: 160px; }
}
</style>
</head>
<body>

<header class="toolbar">
  <div class="brand"><span class="logo"><img src="images/logo.png" alt="图片标记工具"></span><span>图片标记工具</span></div>

  <div class="tgroup">
    <button class="tbtn primary" id="btnUpload" title="上传/拖拽图片"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>上传图片</button>
    <button class="tbtn" id="btnUndo" title="撤销上一步 (Ctrl+Z)"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>撤销</button>
    <button class="tbtn" id="btnReset" title="图片适应窗口大小"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg>重置视图</button>
    <button class="tbtn danger" id="btnClear" title="清空全部标注点"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>清空</button>
  </div>

  <div class="tgroup">
    <button class="tbtn" id="btnGrab" title="抓手：拖拽移动图片，防止误加点"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>抓手</button>
    <div class="dropdown" id="modeDropdown">
      <button class="tbtn" id="btnModeMenu" title="标注模式">
        <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="modeMenuLabel">点</span><span class="caret">▾</span>
      </button>
      <div class="dropdown-menu" id="modeMenu">
        <button class="dd-item" id="btnPointMode" data-mode="point"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5"/></svg>点标注</button>
        <button class="dd-item" id="btnBoxMode" data-mode="box"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/></svg>框选</button>
        <div class="dd-sub">
          <div class="dd-item dd-sub-trigger" id="btnPenGroup"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>标注<span class="caret-r">▸</span></div>
          <div class="dd-submenu">
            <button class="dd-item" id="btnPenMode" data-mode="pen"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>标注笔</button>
            <button class="dd-item" id="btnFrameMode" data-mode="frame"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg>框图</button>
            <button class="dd-item" id="btnTextMode" data-mode="text"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M8 19h8"/></svg>文字</button>
          </div>
        </div>
      </div>
    </div>
    <input type="color" id="toolColorInput" value="#3b82f6" title="画笔/框图/文字颜色" class="tool-color">
  </div>

  <div class="tgroup">
    <button class="tbtn" id="btnLabels" title="开关标注数字显示" aria-pressed="true"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5 6 19M17 5l-2 14M4 9h15M3 15h15"/></svg>显示数字</button>
    <div class="slider-group"><span>点大小</span><input type="range" id="pointSizeRange" min="6" max="30" step="1" value="16"><span class="val" id="pointSizeVal">16px</span></div>
    <div class="slider-group"><span>透明度</span><input type="range" id="opacityRange" min="10" max="100" step="1" value="100"><span class="val" id="opacityVal">100%</span></div>
  </div>

  <div class="tgroup">
    <div class="dropdown" id="exportDropdown">
      <button class="tbtn" id="btnExportMenu" title="导出 / 导入">
        <svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 21h16"/></svg>
        <span>导出</span><span class="caret">▾</span>
      </button>
      <div class="dropdown-menu" id="exportMenu">
        <button class="dd-item" id="btnExport"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M12 10v10"/></svg>导出 CSV</button>
        <button class="dd-item" id="btnImport"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>导入 CSV</button>
        <button class="dd-item" id="btnExportImg"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>导出整图</button>
        <button class="dd-item" id="btnExportView"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>导出窗口</button>
        <button class="dd-item" id="btnCopy"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制数据</button>
      </div>
    </div>

  <span class="file-label" id="fileLabel">未加载图片</span>
</header>

<main class="main" id="main">
  <canvas id="canvas"></canvas>
  <canvas id="overlay"></canvas>

  <div class="drop-hint" id="dropHint">
    <div class="big">🖼️</div>
    <div class="t1">拖拽图片到此处，或点击上传</div>
    <div class="t2">支持 JPG / PNG / WEBP / TIF · 滚轮缩放 · 点/框两种标注 · 点击已有点或框删除 · 空格+左键平移 · Ctrl+Z 撤销 · 可导出/导入 CSV 与标注图片</div>
  </div>

  <aside class="panel color-panel" id="colorPanel">
    <div class="panel-head" id="colorPanelHead"><span class="ph-title"><svg class="pico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>标记表</span><span class="chev">▾</span></div>
    <div class="panel-body">
      <div id="colorList"></div>
      <div class="custom-color"><input type="color" id="customColorInput" value="#ff4d4f"><label>＋ 添加标记</label></div>
    </div>
  </aside>

  <aside class="panel stats-panel" id="statsPanel">
    <div class="panel-head" id="statsPanelHead"><span class="ph-title"><svg class="pico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20v-8M10 20V4M16 20v-6M22 20H2"/></svg>统计</span><span class="chev">▾</span></div>
    <div class="panel-body">
      <div class="stat-total"><span class="num" id="statTotal">0</span><span class="lbl">总数量</span></div>
      <div class="stat-row"><span class="swatch" style="background:#3b82f6"></span><span class="cname">标注点</span><span class="ccount" id="statPointCount">0</span></div>
      <div class="stat-row"><span class="swatch" style="background:#94a3b8"></span><span class="cname">框区</span><span class="ccount" id="statBoxCount">0</span></div>
      <div id="statColorList"></div>
      <div class="stat-actions">
        <button class="tbtn" id="btnExport2"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M12 10v10"/></svg>导出 CSV</button>
        <button class="tbtn" id="btnCopy2"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制数据</button>
      </div>
    </div>
  </aside>

  <div class="zoom-badge" id="zoomBadge"></div>
</main>

<div class="loading-overlay" id="loadingOverlay" style="display:none">
  <div class="spinner"></div>
  <div class="loading-text">正在加载图片…</div>
</div>

<div class="toast" id="toast"></div>
<div class="hover-tip" id="hoverTip"></div>
<input type="file" id="fileInput" accept="image/*,.tif,.tiff" hidden>
<input type="file" id="csvInput" accept=".csv,text/csv" hidden>

<div class="modal-overlay" id="countModal" style="display:none">
  <div class="modal-box">
    <div class="modal-title">框区数量</div>
    <input type="number" id="countInput" min="1" step="1" value="1">
    <div class="modal-actions">
      <button class="tbtn" id="countCancel"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>取消</button>
      <button class="tbtn primary" id="countOk"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>确定</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="textModal" style="display:none">
  <div class="modal-box">
    <div class="modal-title" id="textModalTitle">文字描述</div>
    <input type="text" id="textInput" placeholder="输入描述文字">
    <div class="modal-actions">
      <button class="tbtn" id="textCancel"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>取消</button>
      <button class="tbtn primary" id="textOk"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>确定</button>
    </div>
  </div>
</div>

<div class="ctx-menu" id="ctxMenu" style="display:none">
  <div class="ctx-colors" id="ctxColors"></div>
  <div class="ctx-sep"></div>
  <div class="ctx-size-row" id="ctxSizeRow">
    <button class="ctx-item" id="ctxSizeSmall">小</button>
    <button class="ctx-item" id="ctxSizeMed">中</button>
    <button class="ctx-item" id="ctxSizeLarge">大</button>
  </div>

  <div class="ctx-sep"></div>
  <button class="ctx-item" id="ctxEditText"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>修改文字</button>
  <button class="ctx-item" id="ctxChangeCount"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5 6 19M17 5l-2 14M4 9h15M3 15h15"/></svg>修改数量</button>
  <button class="ctx-item" id="ctxDelete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>删除</button>

</div>

  var lastColor = PALETTE[0].hex; // 上一个使用的颜色（双击空白切换）
  var hoverIdx = -1;              // 悬停命中的标注索引
  var lastAddedIdx = -1;          // 最近一次单击添加的点（用于双击去重）

  function initColorMeta() {
    colorMeta = {};
    customOrder = [];
    for (var i = 0; i < PALETTE.length; i++) {
      colorMeta[PALETTE[i].hex] = { name: PALETTE[i].name, visible: true };
    }
  }
  initColorMeta();

  // ===== 工具函数 =====
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg) {
    toastEl.textContent = msg;

    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);

  function hitRadius() { return Math.max(10, pointSize / 2 + 6); }
  function annotationCount(p) {

    if (p.type === 'pen' || p.type === 'text' || p.type === 'frame') return 0;   // 标注笔/文字/框图不计入统计
    return 1;
  }
  function labelText(p) {
    if (p.type === 'box') return String(p.label) + '-' + (p.count || 1);

  function boxLabelFont(p) {

  // 显示数字开关打开即显示（修复低倍率下不显示数字的问题）
  function labelsShown() { return showLabels; }

  // 生成下一个默认标记名：点数1、点数2……（跳过已占用的名称，除非用户自行更名）
  function nextMarkerName() {
    var n = 1;
    while (true) {
      var candidate = '点数' + n;
      var taken = false;
      for (var hex in colorMeta) {
        if (Object.prototype.hasOwnProperty.call(colorMeta, hex) &&
            colorMeta[hex].name === candidate) { taken = true; break; }
      }
      if (!taken) return candidate;
      n++;

  function ensureColor(hex, name) {
    if (!colorMeta[hex]) {
      colorMeta[hex] = { name: name || nextMarkerName(), visible: true };
      customOrder.push(hex);
    } else if (name && !colorMeta[hex].name) {
      colorMeta[hex].name = name;
    }
  }
  function colorOrder() {
    var order = [];
    for (var hex in colorMeta) {
      if (Object.prototype.hasOwnProperty.call(colorMeta, hex)) order.push(hex);
    }
    return order;
  }
  function colorName(hex) {
    return (colorMeta[hex] && colorMeta[hex].name) || hex;
  }
  // 切换当前颜色，并记录上一个颜色（供双击空白切换）
  function setCurrentColor(hex) {
    if (!colorMeta[hex]) ensureColor(hex);
    if (hex !== currentColor) {
      lastColor = currentColor;
      currentColor = hex;
    }
    saveState(); refreshUI();
  }
  function toggleLabels() {
    showLabels = !showLabels;
    saveState(); refreshUI(); render();
  }

  // ===== 持久化 =====
  function saveState() {
    try {
      var data = {
        settings: {
          pointSize: pointSize, opacity: opacity, showLabels: showLabels,
          currentColor: currentColor, colorMeta: colorMeta, customOrder: customOrder,
          toolColor: toolColor, paletteV: PALETTE_VERSION
        },
        session: img ? {
          name: currentImgName, w: imgW, h: imgH, points: points
        } : null
      };
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {}
  }
  function loadSettings() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var s = JSON.parse(raw).settings;
      if (!s) return;
      if (typeof s.pointSize === 'number') pointSize = s.pointSize;
      if (typeof s.opacity === 'number') opacity = s.opacity;
      if (typeof s.showLabels === 'boolean') showLabels = s.showLabels;
      if (s.currentColor) currentColor = s.currentColor;
      if (s.toolColor) toolColor = s.toolColor;
      if (s.paletteV === PALETTE_VERSION) {
        if (s.colorMeta) colorMeta = s.colorMeta;
        if (Array.isArray(s.customOrder)) customOrder = s.customOrder;
      }
    } catch (e) {}
  }
  function peekSession() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      return JSON.parse(raw).session || null;
    } catch (e) { return null; }
  }

  // ===== 视图变换 =====
  function fit() {
    if (!img) return;
    var W = mainEl.clientWidth, H = mainEl.clientHeight;
    var iw = imgW, ih = imgH;
    var margin = 48;
    var scale = Math.min((W - margin * 2) / iw, (H - margin * 2) / ih);
    view.scale = clamp(scale, MIN_SCALE, MAX_SCALE);
    view.tx = (W - iw * view.scale) / 2;
    view.ty = (H - ih * view.scale) / 2;
    render();
  }
  function zoomAt(sx, sy, factor) {
    var ix = (sx - view.tx) / view.scale;
    var iy = (sy - view.ty) / view.scale;
    var ns = clamp(view.scale * factor, MIN_SCALE, MAX_SCALE);
    if (ns === view.scale) return;
    view.scale = ns;
    view.tx = sx - ix * ns;
    view.ty = sy - iy * ns;
    requestRender(true);
  }
  function resetView() { fit(); }

  function screenToImage(sx, sy) {
    return { x: (sx - view.tx) / view.scale, y: (sy - view.ty) / view.scale };
  }

  // 交互期间用低分辨率预览渲染，交互结束后再全分辨率渲染一次（大图缩放不卡）
  function renderInteractive() {
    render(true);
    clearTimeout(sharpenTimer);
    sharpenTimer = setTimeout(function () { render(false); }, 200);
  }

  // rAF 合并渲染，滚轮缩放时避免同帧内重复重绘
  function requestRender(low) {
    if (renderPending) return;
    renderPending = true;
    requestAnimationFrame(function () {
      renderPending = false;
      if (low) renderInteractive(); else render(false);
    });
  }

  // 拖动平移期间用 CSS transform 提交到 GPU，松开时才真正重绘一次
  function commitPan() {
    if (panShift.x !== 0 || panShift.y !== 0) {
      view.tx += panShift.x;
      view.ty += panShift.y;
      panShift.x = 0;
      panShift.y = 0;
      canvas.style.transform = '';
      renderInteractive();
    }
  }

  // 框选模式下的临时橡皮筋预览（画在 overlay 上，不重绘主画布）
  function overlayCtx() { return overlay.getContext('2d'); }
  function clearOverlay() {
    overlayCtx().clearRect(0, 0, overlay.width, overlay.height);
  }
  function drawBoxPreview(x1, y1, x2, y2) {
    var o = overlayCtx();
    var dpr = overlay.dpr || 1;
    o.setTransform(dpr, 0, 0, dpr, 0, 0);
    o.clearRect(0, 0, overlay.width / dpr, overlay.height / dpr);
    var sx1 = view.tx + x1 * view.scale, sy1 = view.ty + y1 * view.scale;
    var sx2 = view.tx + x2 * view.scale, sy2 = view.ty + y2 * view.scale;
    var rx = Math.min(sx1, sx2), ry = Math.min(sy1, sy2);
    var rw = Math.abs(sx2 - sx1), rh = Math.abs(sy2 - sy1);
    o.fillStyle = 'rgba(59,130,246,0.15)';
    o.fillRect(rx, ry, rw, rh);
    o.strokeStyle = '#3b82f6';
    o.lineWidth = 2;
    o.strokeRect(rx, ry, rw, rh);
  }
  function drawFramePreview(x1, y1, x2, y2) {
    var o = overlayCtx();
    var dpr = overlay.dpr || 1;
    o.setTransform(dpr, 0, 0, dpr, 0, 0);
    o.clearRect(0, 0, overlay.width / dpr, overlay.height / dpr);
    var sx1 = view.tx + x1 * view.scale, sy1 = view.ty + y1 * view.scale;
    var sx2 = view.tx + x2 * view.scale, sy2 = view.ty + y2 * view.scale;
    var rx = Math.min(sx1, sx2), ry = Math.min(sy1, sy2);
    var rw = Math.abs(sx2 - sx1), rh = Math.abs(sy2 - sy1);
    o.strokeStyle = toolColor;
    o.lineWidth = 2;
    o.setLineDash([7, 5]);
    o.strokeRect(rx, ry, rw, rh);
    o.setLineDash([]);
  }
  function drawPenPreview(pts) {
    var o = overlayCtx();
    var dpr = overlay.dpr || 1;
    o.setTransform(dpr, 0, 0, dpr, 0, 0);
    o.clearRect(0, 0, overlay.width / dpr, overlay.height / dpr);
    if (!pts || pts.length < 2) return;
    o.strokeStyle = toolColor;
    o.lineWidth = Math.max(1.5, pointSize * 0.4);
    o.lineJoin = 'round';
    o.lineCap = 'round';
    o.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var sx = view.tx + pts[i][0] * view.scale;
      var sy = view.ty + pts[i][1] * view.scale;
      if (i === 0) o.moveTo(sx, sy); else o.lineTo(sx, sy);
    }
    o.stroke();
  }

  // 悬停高亮（画在 overlay 上，不重绘主画布）
  function clearHover() {
    if (hoverIdx !== -1) {
      hoverIdx = -1;
      hoverTip.style.display = 'none';
      clearOverlay();
    }
  }
  function drawHoverHighlight() {
    var o = overlayCtx();
    var dpr = overlay.dpr || 1;
    o.setTransform(dpr, 0, 0, dpr, 0, 0);
    o.clearRect(0, 0, overlay.width / dpr, overlay.height / dpr);
    if (hoverIdx < 0 || hoverIdx >= points.length) return;
    var p = points[hoverIdx];
    var meta = colorMeta[p.color];
    if (meta && meta.visible === false) return;
    o.strokeStyle = 'rgba(255,255,255,0.9)';
    o.lineWidth = 2;
    o.setLineDash([5, 4]);
    if (p.type === 'box' || p.type === 'frame') {
      var x0 = view.tx + p.x * view.scale, y0 = view.ty + p.y * view.scale;
      var x1 = view.tx + (p.x + p.w) * view.scale, y1 = view.ty + (p.y + p.h) * view.scale;
      o.strokeRect(x0 - 4, y0 - 4, x1 - x0 + 8, y1 - y0 + 8);
    } else if (p.type === 'pen') {
      var pts = p.pts || [];
      o.globalAlpha = 0.55;
      o.lineWidth = Math.max(4, pointSize * 0.4 + 4);
      o.beginPath();
      for (var i = 0; i < pts.length; i++) {
        var sx = view.tx + pts[i][0] * view.scale, sy = view.ty + pts[i][1] * view.scale;
        if (i === 0) o.moveTo(sx, sy); else o.lineTo(sx, sy);
      }
      o.stroke();
      o.globalAlpha = 1;
    } else if (p.type === 'text') {
      var tb = textBoxScreen(p);
      o.strokeRect(tb.x0, tb.y0, tb.w, tb.h);
      if (markMode === 'text') {
        var hx = tb.x0 + tb.w, hy = tb.y0 + tb.h;
        o.setLineDash([]);
        o.fillStyle = '#3b82f6';
        o.fillRect(hx - 6, hy - 6, 12, 12);
        o.strokeStyle = '#ffffff';
        o.lineWidth = 1.5;
        o.strokeRect(hx - 6, hy - 6, 12, 12);
      }
    } else {
      var px = view.tx + p.x * view.scale, py = view.ty + p.y * view.scale;
      o.beginPath();
      o.arc(px, py, Math.max(10, pointSize * 0.6), 0, Math.PI * 2);
      o.stroke();
    }
    o.setLineDash([]);
  }
  function updateHover(e) {
    var rect = canvas.getBoundingClientRect();
    var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    var hit = markMode === 'text' ? hitTestText(sx, sy) : hitTest(sx, sy);
    if (hit !== hoverIdx) {
      hoverIdx = hit;
      if (hit >= 0) {
        var p = points[hit];
        hoverTip.textContent = '#' + labelText(p) + ' · ' + colorName(p.color);
        drawHoverHighlight();
      } else {
        hoverTip.style.display = 'none';
        clearOverlay();
      }
    }
    if (hit >= 0) {
      hoverTip.style.left = e.clientX + 'px';
      hoverTip.style.top = e.clientY + 'px';
      hoverTip.style.display = 'block';
    }
  }

  // ===== 渲染 =====
  function render(low) {
    var W = mainEl.clientWidth, H = mainEl.clientHeight;
    var dpr = canvas.dpr || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#eaf3fb';
    ctx.fillRect(0, 0, W, H);

    if (img) {
      ctx.save();
      ctx.translate(view.tx, view.ty);
      ctx.scale(view.scale, view.scale);
      var src = (low && previewCanvas) ? previewCanvas : img;
      ctx.drawImage(src, 0, 0, imgW, imgH);
      ctx.restore();

      // 图片边框
      var x0 = view.tx, y0 = view.ty;
      var x1 = view.tx + imgW * view.scale;
      var y1 = view.ty + imgH * view.scale;
      ctx.strokeStyle = 'rgba(30,58,95,0.22)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);

      drawPoints(W, H, low);
    }
    zoomBadge.textContent = img ? ('缩放 ' + Math.round(view.scale * 100) + '%') : '';
    if (hoverIdx >= 0) drawHoverHighlight();
  }

  function drawPoints(W, H, low) {
    var r = pointSize / 2;
    var many = points.length > 500;   // 点数过多时降低渲染精度
    var drawLabels = labelsShown() && !low;   // 交互预览帧与低倍率下跳过文字，提升性能
    var halo = drawLabels && !many;
    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      var meta = colorMeta[p.color];
      if (meta && meta.visible === false) continue;

      if (p.type === 'box') {
        drawBox(p, W, H, r, halo, drawLabels);
        continue;
      }
      if (p.type === 'frame') {
        drawFrame(p, W, H, r);
        continue;
      }
      if (p.type === 'pen') {
        drawPen(p);
        continue;
      }
      if (p.type === 'text') {
        drawText(p, W, H, r);
        continue;
      }

      var sx = view.tx + p.x * view.scale;
      var sy = view.ty + p.y * view.scale;
      if (sx < -r - 20 || sx > W + r + 20 || sy < -r - 20 || sy > H + r + 20) continue;

      // 点填充
      ctx.globalAlpha = opacity;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.globalAlpha = 1;

      // 对比描边
      ctx.lineWidth = Math.max(1, r * 0.28);
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.stroke();

      // 数字标签
      if (drawLabels) {
        var txt = String(p.label);
        ctx.font = '600 ' + Math.max(9, Math.round(pointSize * 0.68)) + 'px Inter, "Noto Sans SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (halo) {
          ctx.lineWidth = Math.max(2, Math.round(pointSize * 0.16));
          ctx.strokeStyle = 'rgba(0,0,0,0.85)';
          ctx.strokeText(txt, sx, sy);
        }
        ctx.fillStyle = '#ffffff';
        ctx.fillText(txt, sx, sy);
      }
    }
  }

  function drawBox(p, W, H, r, halo, drawLabels) {
    var x0 = view.tx + p.x * view.scale, y0 = view.ty + p.y * view.scale;
    var x1 = view.tx + (p.x + p.w) * view.scale, y1 = view.ty + (p.y + p.h) * view.scale;
    if (x1 < -20 || x0 > W + 20 || y1 < -20 || y0 > H + 20) return;

    ctx.globalAlpha = opacity * 0.22;
    ctx.fillStyle = p.color;
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.globalAlpha = opacity;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = Math.max(1.5, r * 0.32);
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    ctx.globalAlpha = 1;

    if (drawLabels) {
      var txt = labelText(p);
      var fs = boxLabelFont(p);
      ctx.font = '600 ' + fs + 'px Inter, "Noto Sans SC", sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      var lx = x0 + 5, ly = y0 + 5;
      if (halo) {
        ctx.lineWidth = Math.max(2, Math.round(pointSize * 0.16));
        ctx.strokeStyle = 'rgba(0,0,0,0.85)';
        ctx.strokeText(txt, lx, ly);
      }
      ctx.fillStyle = '#ffffff';
      ctx.fillText(txt, lx, ly);
    }
  }

  function drawFrame(p, W, H, r) {
    var x0 = view.tx + p.x * view.scale, y0 = view.ty + p.y * view.scale;
    var x1 = view.tx + (p.x + p.w) * view.scale, y1 = view.ty + (p.y + p.h) * view.scale;
    if (x1 < -20 || x0 > W + 20 || y1 < -20 || y0 > H + 20) return;
    ctx.globalAlpha = (p.alpha != null ? p.alpha : 1) * opacity;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = Math.max(1.5, r * 0.32);
    ctx.setLineDash([7, 5]);
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  function drawPen(p) {
    var pts = p.pts || [];
    if (pts.length < 2) return;
    ctx.globalAlpha = opacity;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = Math.max(1.5, pointSize * 0.4);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var sx = view.tx + pts[i][0] * view.scale;
      var sy = view.ty + pts[i][1] * view.scale;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function textFontSize(p) {
    return TEXT_BASE * (p.size || 1);
  }
  // 文字标注的屏幕包围盒（含 4px 内边距，与 drawText 一致）
  function textBoxScreen(p) {
    var fs = textFontSize(p);
    var txt = p.text || '';
    ctx.font = '600 ' + fs + 'px Inter, "Noto Sans SC", sans-serif';
    var w = (ctx.measureText ? ctx.measureText(txt).width : txt.length * fs * 0.6) + 8;
    var h = fs + 8;
    return { x0: view.tx + p.x * view.scale - 4, y0: view.ty + p.y * view.scale - 4, w: w, h: h };
  }
  function textAnchorScreen(p) {
    return { x: view.tx + p.x * view.scale, y: view.ty + p.y * view.scale };
  }
  // 是否命中文字右下角的缩放手柄
  function textResizeHit(p, sx, sy) {
    var b = textBoxScreen(p);
    return Math.hypot(sx - (b.x0 + b.w), sy - (b.y0 + b.h)) <= 16;
  }
  // 命中检测：只检测文字标注（自顶向下），用于文字模式下的拖动/缩放，
  // 避免被覆盖在文字上方的框图/画笔等其它图层抢走选中
  function hitTestText(sx, sy) {
    for (var i = points.length - 1; i >= 0; i--) {
      var p = points[i];
      if (p.type !== 'text') continue;
      var meta = colorMeta[p.color];
      if (meta && meta.visible === false) continue;
      var tb = textBoxScreen(p);
      if (sx >= tb.x0 && sx <= tb.x0 + tb.w && sy >= tb.y0 && sy <= tb.y0 + tb.h) return i;
    }
    return -1;
  }
  function drawText(p, W, H, r) {
    var sx = view.tx + p.x * view.scale;
    var sy = view.ty + p.y * view.scale;
    if (sx < -300 || sx > W + 300 || sy < -100 || sy > H + 100) return;
    var txt = p.text || '';
    var fs = textFontSize(p);
    ctx.font = '600 ' + fs + 'px Inter, "Noto Sans SC", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    var w = (ctx.measureText ? ctx.measureText(txt).width : txt.length * fs * 0.6) + 8;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(sx - 4, sy - 4, w, fs + 8);
    ctx.fillStyle = p.color;
    ctx.fillText(txt, sx, sy);
  }
  // 拖动/缩放文字时在 overlay 上绘制预览（x/y 为图像坐标，size 为字号倍率）
  function drawTextPreview(p, x, y, size) {
    var o = overlayCtx();
    var dpr = overlay.dpr || 1;
    o.setTransform(dpr, 0, 0, dpr, 0, 0);
    o.clearRect(0, 0, overlay.width / dpr, overlay.height / dpr);
    var fs = TEXT_BASE * (size != null ? size : (p.size || 1));
    var txt = p.text || '';
    o.font = '600 ' + fs + 'px Inter, "Noto Sans SC", sans-serif';
    o.textAlign = 'left';
    o.textBaseline = 'top';
    var w = (o.measureText ? o.measureText(txt).width : txt.length * fs * 0.6) + 8;
    var sx = view.tx + x * view.scale, sy = view.ty + y * view.scale;
    o.fillStyle = 'rgba(0,0,0,0.45)';
    o.fillRect(sx - 4, sy - 4, w, fs + 8);
    o.fillStyle = p.color;
    o.globalAlpha = 0.85;
    o.fillText(txt, sx, sy);
    o.globalAlpha = 1;
  }

  function resizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var w = mainEl.clientWidth, h = mainEl.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.dpr = dpr;
    overlay.width = canvas.width;
    overlay.height = canvas.height;
    overlay.style.width = w + 'px';
    overlay.style.height = h + 'px';
    overlay.dpr = dpr;
    render();
  }

  // ===== 命中检测 =====
  function distToSegment(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay;
    var len2 = dx * dx + dy * dy;
    var t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    var cx = ax + t * dx, cy = ay + t * dy;
    return Math.hypot(px - cx, py - cy);
  }
  function hitPen(p, sx, sy, hr) {
    var pts = p.pts || [];
    for (var i = 0; i < pts.length - 1; i++) {
      var ax = view.tx + pts[i][0] * view.scale, ay = view.ty + pts[i][1] * view.scale;
      var bx = view.tx + pts[i + 1][0] * view.scale, by = view.ty + pts[i + 1][1] * view.scale;
      if (distToSegment(sx, sy, ax, ay, bx, by) <= hr) return true;
    }
    return false;
  }
  function hitTest(sx, sy) {
    var hr = hitRadius();
    for (var i = points.length - 1; i >= 0; i--) {
      var p = points[i];
      var meta = colorMeta[p.color];
      if (meta && meta.visible === false) continue;
      if (p.type === 'box' || p.type === 'frame') {
        var bx0 = view.tx + p.x * view.scale, by0 = view.ty + p.y * view.scale;
        var bx1 = view.tx + (p.x + p.w) * view.scale, by1 = view.ty + (p.y + p.h) * view.scale;
        var tol = 6;
        if (sx >= bx0 - tol && sx <= bx1 + tol && sy >= by0 - tol && sy <= by1 + tol) return i;
      } else if (p.type === 'pen') {
        if (hitPen(p, sx, sy, hr)) return i;
      } else if (p.type === 'text') {
        var tb = textBoxScreen(p);
        if (sx >= tb.x0 && sx <= tb.x0 + tb.w && sy >= tb.y0 && sy <= tb.y0 + tb.h) return i;
      } else {
        var px = view.tx + p.x * view.scale;
        var py = view.ty + p.y * view.scale;
        if (Math.hypot(sx - px, sy - py) <= hr) return i;
      }
    }
    return -1;
  }

  // ===== 数据操作 =====
  function pushUndo() {

  // ===== UI 刷新 =====
  function computeCounts() {
    var counts = {};

  function refreshUI() {

  function renderColorPanel(counts) {

        '<button class="icon-btn del-btn" data-hex="' + hex + '" title="删除标记"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>';

  // 重命名颜色（点击 ✏️）
  function startRename(hex) {
    var span = colorList.querySelector('.cname[data-hex="' + hex + '"]');
    if (!span) return;
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'cname-edit';
    input.value = (colorMeta[hex] && colorMeta[hex].name) || hex;
    span.replaceWith(input);
    input.focus();
    input.select();
    var done = false;
    function commit() {
      if (done) return; done = true;
      var v = input.value.trim();
      if (v) {
        if (!colorMeta[hex]) colorMeta[hex] = { name: hex, visible: true };
        colorMeta[hex].name = v;
      }
      saveState(); refreshUI();
    }
    function cancel() {
      if (done) return; done = true;
      refreshUI();
    }
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
    input.addEventListener('blur', commit);
  }
  // 删除颜色（连同该颜色下的所有标注一并删除）
  function removeColor(hex) {
    var meta = colorMeta[hex];
    if (!meta) return;
    if (Object.keys(colorMeta).length <= 1) { toast('至少保留一个标记'); return; }
    var cnt = 0;
    for (var i = 0; i < points.length; i++) if (points[i].color === hex) cnt++;
    if (cnt > 0 && !confirm('删除标记「' + meta.name + '」将同时删除其 ' + cnt + ' 个标注，确定？')) return;
    pushUndo();
    var kept = [];
    for (var j = 0; j < points.length; j++) if (points[j].color !== hex) kept.push(points[j]);
    points = kept;
    delete colorMeta[hex];
    for (var k = 0; k < customOrder.length; k++) if (customOrder[k] === hex) { customOrder.splice(k, 1); k--; }
    if (currentColor === hex) currentColor = colorOrder()[0];
    afterDataChange();
  }
  // 修改某个颜色的颜色值：所有该颜色的标注一并改色
  function recolor(oldHex, newHex) {
    newHex = String(newHex || '').toLowerCase();
    if (!newHex || newHex === oldHex) return;
    if (!colorMeta[oldHex]) return;
    if (colorMeta[newHex]) { toast('该颜色已存在'); return; }
    var meta = colorMeta[oldHex];
    delete colorMeta[oldHex];
    colorMeta[newHex] = { name: meta.name, visible: meta.visible };
    for (var i = 0; i < customOrder.length; i++) if (customOrder[i] === oldHex) customOrder[i] = newHex;
    for (var j = 0; j < points.length; j++) if (points[j].color === oldHex) points[j].color = newHex;
    if (currentColor === oldHex) currentColor = newHex;
    saveState(); refreshUI(); render();
  }

  // ===== 导出 / 复制 =====
  function buildCSV() {
    var lines = ['id,label,type,x,y,width,height,count,color,color_name,text,points,label_size,alpha,text_size'];
    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      var type = p.type === 'box' ? 'box' : (p.type === 'pen' ? 'pen' : (p.type === 'text' ? 'text' : (p.type === 'frame' ? 'frame' : 'point')));
      var w = (p.type === 'box' || p.type === 'frame') ? p.w : 0;
      var h = (p.type === 'box' || p.type === 'frame') ? p.h : 0;
      var c = p.type === 'box' ? (p.count || 1) : 1;
      var txt = p.type === 'text' ? (p.text || '') : '';
      var x = p.x, y = p.y;
      var ptsStr = '';
      if (p.type === 'pen' && p.pts && p.pts.length) {
        x = p.pts[0][0]; y = p.pts[0][1];
        ptsStr = p.pts.map(function (q) { return q[0] + ';' + q[1]; }).join(' ');
      }
      var lsz = p.type === 'box' ? (p.labelSize || 'medium') : '';
      var alpha = p.type === 'frame' ? (p.alpha != null ? p.alpha : 1) : '';
      var tsz = p.type === 'text' ? (p.size != null ? p.size : 1) : '';
      lines.push([p.id, p.label, type, x, y, w, h, c, p.color, '"' + colorName(p.color) + '"', '"' + String(txt).replace(/"/g, '""') + '"', '"' + ptsStr + '"', lsz, alpha, tsz].join(','));
    }
    return lines.join('\n');
  }
  function timestamp() {
    var d = new Date();
    function p2(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '_' + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds());
  }
  function exportCSV() {
    if (!points.length) { toast('暂无标注'); return; }
    var csv = buildCSV();
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '标注数据_' + timestamp() + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('已导出 CSV');
  }
  function copyData() {
    if (!points.length) { toast('暂无标注'); return; }
    var csv = buildCSV();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = csv;
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      toast(ok ? '已复制到剪贴板' : '复制失败，请手动导出');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(csv).then(function () {
        toast('已复制到剪贴板');
      }).catch(fallback);
    } else {
      fallback();
    }
  }

  // 导出带标注的图片。txFn(x,y) 将图像坐标映射到画布坐标。
  function drawAnnotationLayer(g, txFn, R, fs) {
    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      var meta = colorMeta[p.color];
      if (meta && meta.visible === false) continue;
      if (p.type === 'box') {
        var a = txFn(p.x, p.y), b = txFn(p.x + p.w, p.y + p.h);
        var x0 = a[0], y0 = a[1], x1 = b[0], y1 = b[1];
        g.globalAlpha = 0.25;
        g.fillStyle = p.color;
        g.fillRect(x0, y0, x1 - x0, y1 - y0);
        g.globalAlpha = 1;
        g.strokeStyle = p.color;
        g.lineWidth = Math.max(2, Math.round(R * 0.4));
        g.strokeRect(x0, y0, x1 - x0, y1 - y0);
      } else if (p.type === 'frame') {
        var fa = txFn(p.x, p.y), fb = txFn(p.x + p.w, p.y + p.h);
        var fx0 = fa[0], fy0 = fa[1], fx1 = fb[0], fy1 = fb[1];
        g.strokeStyle = p.color;
        g.lineWidth = Math.max(2, Math.round(R * 0.4));
        g.globalAlpha = (p.alpha != null ? p.alpha : 1);
        g.setLineDash([Math.max(6, R), Math.max(4, Math.round(R * 0.7))]);
        g.strokeRect(fx0, fy0, fx1 - fx0, fy1 - fy0);
        g.setLineDash([]);
        g.globalAlpha = 1;
      } else if (p.type === 'pen') {
        var pts = p.pts || [];
        if (pts.length >= 2) {
          g.strokeStyle = p.color;
          g.lineWidth = Math.max(2, Math.round(R * 0.5));
          g.lineJoin = 'round'; g.lineCap = 'round';
          g.beginPath();
          for (var k = 0; k < pts.length; k++) {
            var q = txFn(pts[k][0], pts[k][1]);
            if (k === 0) g.moveTo(q[0], q[1]); else g.lineTo(q[0], q[1]);
          }
          g.stroke();
        }
      } else if (p.type === 'text') {
        var tp = txFn(p.x, p.y);
        var tfs = Math.max(16, Math.round(R * 1.6)) * (p.size || 1);
        g.font = '600 ' + tfs + 'px Inter, "Noto Sans SC", sans-serif';
        g.textAlign = 'left'; g.textBaseline = 'top';
        var tw = g.measureText(p.text || '').width + 8;
        g.fillStyle = 'rgba(0,0,0,0.55)';
        g.fillRect(tp[0] - 4, tp[1] - 4, tw, tfs + 8);
        g.fillStyle = p.color;
        g.fillText(p.text || '', tp[0], tp[1]);
      } else {
        var cp = txFn(p.x, p.y);
        g.beginPath();
        g.arc(cp[0], cp[1], R, 0, Math.PI * 2);
        g.fillStyle = p.color;
        g.fill();
        g.lineWidth = Math.max(1, Math.round(R * 0.28));
        g.strokeStyle = 'rgba(0,0,0,0.55)';
        g.stroke();
      }
      if (showLabels && p.type !== 'pen' && p.type !== 'text' && p.type !== 'frame') {
        var lp = txFn(p.x, p.y);
        var lx = lp[0], ly = lp[1];
        g.font = '600 ' + fs + 'px Inter, "Noto Sans SC", sans-serif';
        if (p.type === 'box') { g.textAlign = 'left'; g.textBaseline = 'top'; lx = lp[0] + fs * 0.4; ly = lp[1] + fs * 0.4; }
        else { g.textAlign = 'center'; g.textBaseline = 'middle'; }
        g.lineWidth = Math.max(2, Math.round(fs * 0.22));
        g.strokeStyle = 'rgba(0,0,0,0.85)';
        g.strokeText(labelText(p), lx, ly);
        g.fillStyle = '#ffffff';
        g.fillText(labelText(p), lx, ly);
      }
    }
  }
  function exportImage(mode) {
    if (!img) { toast('请先加载图片'); return; }
    if (!points.length) { toast('暂无标注'); return; }
    var c = document.createElement('canvas');
    var g;
    var base = (currentImgName || 'image').replace(/\.[^.]+$/, '');
    var name;
    if (mode === 'viewport') {
      // 导出当前窗口可见区域（按当前缩放与窗口尺寸）
      var W = mainEl.clientWidth, H = mainEl.clientHeight;
      c.width = W; c.height = H;
      g = c.getContext('2d');
      g.fillStyle = '#eaf3fb';
      g.fillRect(0, 0, W, H);
      var vx0 = (0 - view.tx) / view.scale, vy0 = (0 - view.ty) / view.scale;
      var vx1 = (W - view.tx) / view.scale, vy1 = (H - view.ty) / view.scale;
      vx0 = Math.max(0, vx0); vy0 = Math.max(0, vy0);
      vx1 = Math.min(imgW, vx1); vy1 = Math.min(imgH, vy1);
      g.save();
      g.translate(-vx0 * view.scale, -vy0 * view.scale);
      g.scale(view.scale, view.scale);
      g.drawImage(img, 0, 0, imgW, imgH);
      g.restore();
      drawAnnotationLayer(g, function (x, y) { return [(x - vx0) * view.scale, (y - vy0) * view.scale]; },
        Math.max(3, pointSize / 2), Math.max(12, Math.round(pointSize * 0.85)));
      name = '标注窗口_' + base + '_' + timestamp() + '.png';
    } else {
      // 导出整张图片（原始分辨率）
      c.width = imgW; c.height = imgH;
      g = c.getContext('2d');
      g.drawImage(img, 0, 0, imgW, imgH);
      var R = Math.max(3, Math.round(Math.min(imgW, imgH) * 0.008));
      drawAnnotationLayer(g, function (x, y) { return [x, y]; }, R, Math.max(12, Math.round(R * 1.6)));
      name = '标注结果_' + base + '_' + timestamp() + '.png';
    }

    var url;
    try { url = c.toDataURL('image/png'); }
    catch (e) { toast('导出失败：' + (e && e.message ? e.message : e)); return; }
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast(mode === 'viewport' ? '已导出当前窗口图片' : '已导出整张图片');
  }

  // 解析 CSV（兼容有无 type/width/height 列）
  function splitCSVLine(line) {
    var cells = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (inQ) {
        if (ch === '"') inQ = false; else cur += ch;
      } else {
        if (ch === '"') inQ = true;
        else if (ch === ',') { cells.push(cur); cur = ''; }
        else cur += ch;
      }
    }
    cells.push(cur);
    for (var j = 0; j < cells.length; j++) cells[j] = cells[j].trim();
    return cells;
  }
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim().length > 0; });
    if (!lines.length) return [];
    var header = splitCSVLine(lines[0]).map(function (h) { return h.toLowerCase(); });
    function colIdx(names) {
      for (var i = 0; i < names.length; i++) {
        var j = header.indexOf(names[i]);
        if (j >= 0) return j;
      }
      return -1;
    }
    var ciX = colIdx(['x']), ciY = colIdx(['y']), ciColor = colIdx(['color']);
    var ciType = colIdx(['type']), ciW = colIdx(['width', 'w']), ciH = colIdx(['height', 'h']);
    var ciCount = colIdx(['count', '数量']);
    var ciText = colIdx(['text', '文字']), ciPts = colIdx(['points', 'pts']);
    var ciLsz = colIdx(['label_size', 'labelsize', '字号']);
    var ciAlpha = colIdx(['alpha', 'opacity', '透明度']);
    var ciTsz = colIdx(['text_size', 'textsize', 'size', '字号大小']);
    var ciName = colIdx(['color_name', 'colorname', '名称']);
    if (ciX < 0 || ciY < 0) throw new Error('缺少 x/y 列');
    var out = [];
    for (var r = 1; r < lines.length; r++) {
      var cells = splitCSVLine(lines[r]);
      var x = parseFloat(cells[ciX]);
      var y = parseFloat(cells[ciY]);
      if (isNaN(x) || isNaN(y)) continue;
      var color = (ciColor >= 0 && cells[ciColor]) ? cells[ciColor] : currentColor;
      var type = (ciType >= 0 && cells[ciType]) ? cells[ciType].toLowerCase() : 'point';
      var w = (ciW >= 0 && cells[ciW]) ? parseFloat(cells[ciW]) : 0;
      var h = (ciH >= 0 && cells[ciH]) ? parseFloat(cells[ciH]) : 0;
      var count = (ciCount >= 0 && cells[ciCount]) ? parseInt(cells[ciCount], 10) : 1;
      if (isNaN(w)) w = 0; if (isNaN(h)) h = 0;
      if (isNaN(count) || count < 1) count = 1;
      if ((type === 'box' || type === 'frame') && (w <= 0 || h <= 0)) type = 'point';
      var obj = { id: 0, x: x, y: y, color: color, label: 0 };
      var cname = (ciName >= 0 && cells[ciName]) ? cells[ciName] : '';
      if (cname) obj._colorName = cname;
      if (type === 'box') {
        obj.type = 'box'; obj.w = w; obj.h = h; obj.count = count;
        var lsz = (ciLsz >= 0 && cells[ciLsz]) ? cells[ciLsz].toLowerCase() : '';
        obj.labelSize = (lsz === 'small' || lsz === 'large' || lsz === 'medium') ? lsz : 'medium';
      }
      else if (type === 'frame') {
        obj.type = 'frame'; obj.w = w; obj.h = h;
        if (ciAlpha >= 0 && cells[ciAlpha]) { var al = parseFloat(cells[ciAlpha]); if (!isNaN(al)) obj.alpha = clamp(al, 0.1, 1); }
      }
      else if (type === 'pen') {
        var ptsStr = (ciPts >= 0 && cells[ciPts]) ? cells[ciPts] : '';
        var pts = [];
        if (ptsStr) {
          var segs = ptsStr.split(/\s+/);
          for (var s = 0; s < segs.length; s++) {
            var xy = segs[s].split(';');
            var qx = parseFloat(xy[0]), qy = parseFloat(xy[1]);
            if (!isNaN(qx) && !isNaN(qy)) pts.push([qx, qy]);
          }
        }
        obj.type = 'pen'; obj.pts = pts;
      }
      else if (type === 'text') {
        obj.type = 'text';
        obj.text = (ciText >= 0 && cells[ciText]) ? cells[ciText] : '';
        if (ciTsz >= 0 && cells[ciTsz]) { var ts = parseFloat(cells[ciTsz]); if (!isNaN(ts)) obj.size = clamp(ts, 0.4, 6); }
      }
      out.push(obj);
    }
    return out;
  }
  function importCSVFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = parseCSV(reader.result);
        if (!parsed.length) { toast('CSV 中没有标注数据'); return; }
        if (points.length && !confirm('导入将替换当前 ' + points.length + ' 个标注，是否继续？')) return;
        pushUndo();
        points = parsed;
        for (var i = 0; i < points.length; i++) ensureColor(points[i].color, points[i]._colorName);
        afterDataChange();
        toast('已导入 ' + points.length + ' 个标注');
      } catch (e) {
        toast('CSV 解析失败：' + (e && e.message ? e.message : '格式错误'));
      }
    };
    reader.onerror = function () { toast('文件读取失败'); };
    reader.readAsText(file, 'utf-8');
  }

  // ===== 图片加载 =====
  function isTiff(file) {
    var name = (file.name || '').toLowerCase();
    return name.slice(-4) === '.tif' || name.slice(-5) === '.tiff' || file.type === 'image/tiff';
  }

  function showLoading() { if (loadingOverlay) loadingOverlay.style.display = 'flex'; }
  function hideLoading() { if (loadingOverlay) loadingOverlay.style.display = 'none'; }
  function loadImageFromFile(file) {
    if (!file || (!file.type && !isTiff(file))) {
      toast('请选择图片文件'); return;
    }
    if (file.type && file.type.indexOf('image/') !== 0 && !isTiff(file)) {
      toast('请选择图片文件'); return;
    }
    if (points.length && currentImgName && file.name !== currentImgName) {
      if (!confirm('当前有 ' + points.length + ' 个标注，加载新图片将清除。是否继续？')) return;
    }
    showLoading();
    if (isTiff(file)) {
      loadTiff(file);
    } else {
      loadRaster(file);
    }
  }

  // 普通位图（JPG / PNG / WebP / BMP ...）走浏览器原生解码
  function loadRaster(file) {
    var url = URL.createObjectURL(file);
    var tmp = new Image();
    tmp.onload = function () {
      commitImage(tmp, file.name, tmp.naturalWidth, tmp.naturalHeight, url);
    };
    tmp.onerror = function () {
      URL.revokeObjectURL(url);
      hideLoading();
      toast('图片加载失败');
    };
    tmp.src = url;
  }

  // TIFF 走 UTIF 解码器
  function loadTiff(file) {
    var reader = new FileReader();
    reader.onload = function () {
      // 先让浏览器渲染出加载动画，再执行同步的 TIFF 解码，避免转圈动画被卡住
      setTimeout(function () {
        try {
          var canvas = tiffToCanvas(reader.result);
          commitImage(canvas, file.name, canvas.width, canvas.height, null);
        } catch (e) {
          hideLoading();
          toast('TIFF 解析失败：' + (e && e.message ? e.message : '未知错误'));
        }
      }, 30);
    };
    reader.onerror = function () { hideLoading(); toast('文件读取失败'); };
    reader.readAsArrayBuffer(file);
  }

  function commitImage(source, name, w, h, url) {
    hideLoading();
    if (imgUrl) URL.revokeObjectURL(imgUrl);
    imgUrl = url;                 // TIFF 为 null（无需释放）
    img = source;
    imgW = w;
    imgH = h;
    currentImgName = name;
    dropHint.classList.add('hidden');

    var saved = peekSession();
    var restored = false;
    if (saved && saved.name === name && saved.w === w && saved.h === h) {
      points = saved.points || [];
      restored = points.length > 0;
    } else {
      points = [];
    }
    undoStack = [];
    renumber();
    buildPreview();
    fit();
    saveState();
    refreshUI();
    if (restored) toast('已恢复上次标注 ' + points.length + ' 个');
    else toast('图片已加载，可添加点或框选标注');
  }

  // 生成降采样预览画布：超大图在缩放/平移交互时用低分辨率位图，结束后再全分辨率渲染
  function buildPreview() {
    previewCanvas = null;
    if (!img) return;
    var MAX = 2048;
    var s = Math.min(1, MAX / Math.max(imgW, imgH));
    if (s >= 1) return;
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(imgW * s));
    c.height = Math.max(1, Math.round(imgH * s));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    previewCanvas = c;
  }

  // 用 UTIF 解码 TIFF 到 Canvas
  function tiffToCanvas(buffer) {
    if (typeof UTIF === 'undefined') throw new Error('TIFF 解码器未加载');
    var ifds = UTIF.decode(buffer);
    if (!ifds || !ifds.length) throw new Error('无效的 TIFF 文件');
    var ifd = null;
    for (var i = 0; i < ifds.length; i++) {
      if (ifds[i] && ifds[i].t256 != null) { ifd = ifds[i]; break; }
    }
    if (!ifd) throw new Error('未找到图像数据');
    UTIF.decodeImage(buffer, ifd, ifds);
    var w = ifd.width, h = ifd.height;
    var intp = ifd.t262 ? ifd.t262[0] : 1;                       // 光度解释
    var bps = ifd.t258 ? Math.min(32, ifd.t258[0]) : 8;          // 每样本位数

    var rgba;
    if ((intp === 1 || intp === 0) && bps === 16) {
      rgba = grayscale16ToRGBA(ifd);   // 16-bit 灰度做最小-最大归一化，避免 EL 图过暗
    } else {
      rgba = UTIF.toRGBA8(ifd);
    }

    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var cctx = canvas.getContext('2d');
    var imgd = cctx.createImageData(w, h);
    imgd.data.set(rgba);
    cctx.putImageData(imgd, 0, 0);
    return canvas;
  }

  // 16-bit 灰度 → 8-bit RGBA（最小-最大对比度拉伸）
  function grayscale16ToRGBA(ifd) {
    var w = ifd.width, h = ifd.height;
    var data = ifd.data;            // Uint8Array，每样本 2 字节
    var isLE = !!ifd.isLE;          // II=小端 / MM=大端
    var invert = ifd.t262 && ifd.t262[0] === 0;  // WhiteIsZero 需反相
    var n = w * h;

    var mn = 65535, mx = 0;
    for (var i = 0; i < n; i++) {
      var b0 = data[i * 2], b1 = data[i * 2 + 1];
      var v = isLE ? (b0 | (b1 << 8)) : ((b0 << 8) | b1);
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
    if (mx <= mn) mx = mn + 1;
    var scale = 255 / (mx - mn);

    var out = new Uint8Array(n * 4);
    for (var i = 0; i < n; i++) {
      var b0 = data[i * 2], b1 = data[i * 2 + 1];
      var v = isLE ? (b0 | (b1 << 8)) : ((b0 << 8) | b1);
      var g = (v - mn) * scale;
      if (invert) g = 255 - g;
      var o = i * 4;
      out[o] = out[o + 1] = out[o + 2] = g;
      out[o + 3] = 255;
    }
    return out;
  }

  colorList.addEventListener('change', function (e) {
    var rc = e.target.closest('.recolor');
    if (rc) recolor(rc.getAttribute('data-hex'), rc.value);
  });

  dropHint.addEventListener('click', openFile);

  // 面板折叠
  document.getElementById('colorPanelHead').addEventListener('click', function () {
    document.getElementById('colorPanel').classList.toggle('collapsed');
  });
  document.getElementById('statsPanelHead').addEventListener('click', function () {
    document.getElementById('statsPanel').classList.toggle('collapsed');
  });

  // 拖拽上传
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });
  mainEl.addEventListener('dragover', function (e) { e.preventDefault(); mainEl.classList.add('dragging'); });
  mainEl.addEventListener('dragleave', function () { mainEl.classList.remove('dragging'); });
  mainEl.addEventListener('drop', function (e) {
    e.preventDefault();
    mainEl.classList.remove('dragging');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadImageFromFile(f);
  });

  // 粘贴图片
  window.addEventListener('paste', function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        var f = items[i].getAsFile();
        if (f) { loadImageFromFile(f); break; }
      }
    }
  });

  // 鼠标滚轮缩放（以鼠标位置为中心）
  canvas.addEventListener('wheel', function (e) {
    if (!img) return;
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.12 : 1 / 1.12);
  }, { passive: false });

  // 指针：点击加点/删点，拖动平移
  canvas.addEventListener('pointerdown', function (e) {
    if (!img) return;
    if (e.button === 2) return; // 右键交给 contextmenu 处理
    hideCtxMenu();
    clearHover();
    if (e.button === 1) e.preventDefault(); // 避免中键自动滚动
    var rect = canvas.getBoundingClientRect();
    var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    var mode = 'add', startIx = 0, startIy = 0;
    var dragHit = -1, origX = 0, origY = 0, origSize = 1, startDist = 0;
    if (spaceDown || e.button === 1 || panMode) {
      mode = 'pan';
    } else if (markMode === 'box') {
      mode = 'box';
      var ip0 = screenToImage(sx, sy);
      startIx = ip0.x; startIy = ip0.y;
    } else if (markMode === 'frame') {
      mode = 'frame';
      var ipf = screenToImage(sx, sy);
      startIx = ipf.x; startIy = ipf.y;
    } else if (markMode === 'pen') {
      mode = 'pen';
      var ip1 = screenToImage(sx, sy);
      startIx = ip1.x; startIy = ip1.y;
    } else if (markMode === 'text') {
      var hitT = hitTestText(sx, sy);
      if (hitT >= 0 && points[hitT] && points[hitT].type === 'text') {
        var tp = points[hitT];
        if (textResizeHit(tp, sx, sy)) {
          mode = 'resizeText';
          dragHit = hitT;
          origSize = tp.size || 1;
          var anchorR = textAnchorScreen(tp);
          startDist = Math.hypot(sx - anchorR.x, sy - anchorR.y);
        } else {
          mode = 'moveText';
          dragHit = hitT;
          origX = tp.x; origY = tp.y;
          var ipm = screenToImage(sx, sy);
          startIx = ipm.x; startIy = ipm.y;
        }
      } else {
        mode = 'text';
        var ip2 = screenToImage(sx, sy);
        startIx = ip2.x; startIy = ip2.y;
      }
    }
    drag = {
      mode: mode, moved: false,
      startIx: startIx, startIy: startIy,
      hit: dragHit, origX: origX, origY: origY, origSize: origSize, startDist: startDist,
      pts: mode === 'pen' ? [[startIx, startIy]] : null,
      cx: e.clientX, cy: e.clientY,
      lastCx: e.clientX, lastCy: e.clientY
    };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) { if (img) updateHover(e); return; }
    var dx = e.clientX - drag.lastCx;
    var dy = e.clientY - drag.lastCy;
    if (Math.hypot(e.clientX - drag.cx, e.clientY - drag.cy) > 3) drag.moved = true;
    if (drag.mode === 'pen' && drag.moved) {
      var rectP = canvas.getBoundingClientRect();
      var ipP = screenToImage(e.clientX - rectP.left, e.clientY - rectP.top);
      drag.pts.push([ipP.x, ipP.y]);
      drawPenPreview(drag.pts);
    } else if (drag.mode === 'box' && drag.moved) {
      var rect = canvas.getBoundingClientRect();
      var ip = screenToImage(e.clientX - rect.left, e.clientY - rect.top);
      drawBoxPreview(drag.startIx, drag.startIy, ip.x, ip.y);
    } else if (drag.mode === 'frame' && drag.moved) {
      var rectF = canvas.getBoundingClientRect();
      var ipF = screenToImage(e.clientX - rectF.left, e.clientY - rectF.top);
      drawFramePreview(drag.startIx, drag.startIy, ipF.x, ipF.y);
    } else if (drag.mode === 'moveText' && drag.moved) {
      var rectM = canvas.getBoundingClientRect();
      var ipM = screenToImage(e.clientX - rectM.left, e.clientY - rectM.top);
      var ptM = points[drag.hit];
      drawTextPreview(ptM, drag.origX + (ipM.x - drag.startIx), drag.origY + (ipM.y - drag.startIy), ptM.size || 1);
    } else if (drag.mode === 'resizeText' && drag.moved) {
      var rectR = canvas.getBoundingClientRect();
      var ptR = points[drag.hit];
      var anchorR = textAnchorScreen(ptR);
      var distR = Math.hypot((e.clientX - rectR.left) - anchorR.x, (e.clientY - rectR.top) - anchorR.y);
      var newSize = clamp(drag.origSize * (distR / Math.max(1, drag.startDist)), 0.4, 6);
      drawTextPreview(ptR, ptR.x, ptR.y, newSize);
    } else if (drag.moved) {
      // 拖动期间用 GPU 合成层平移，避免每帧重绘大图导致卡顿
      panShift.x += dx;
      panShift.y += dy;
      canvas.style.transform = 'translate(' + panShift.x + 'px,' + panShift.y + 'px)';
    }
    drag.lastCx = e.clientX;
    drag.lastCy = e.clientY;
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!drag) return;
    if (drag.mode === 'box') {
      clearOverlay();
      if (drag.moved) {
        var rect = canvas.getBoundingClientRect();
        var ip = screenToImage(e.clientX - rect.left, e.clientY - rect.top);
        var x1 = Math.min(drag.startIx, ip.x), y1 = Math.min(drag.startIy, ip.y);
        var x2 = Math.max(drag.startIx, ip.x), y2 = Math.max(drag.startIy, ip.y);
        var w = x2 - x1, h = y2 - y1;
        if (w >= 3 && h >= 3) openCountModal(x1, y1, w, h);
      }
    } else if (drag.mode === 'pen') {
      clearOverlay();
      if (drag.moved) addPenStroke(drag.pts);
    } else if (drag.mode === 'frame') {
      clearOverlay();
      if (drag.moved) {
        var rectF = canvas.getBoundingClientRect();
        var ipF = screenToImage(e.clientX - rectF.left, e.clientY - rectF.top);
        var x1 = Math.min(drag.startIx, ipF.x), y1 = Math.min(drag.startIy, ipF.y);
        var x2 = Math.max(drag.startIx, ipF.x), y2 = Math.max(drag.startIy, ipF.y);
        var w = x2 - x1, h = y2 - y1;
        if (w >= 3 && h >= 3) addFrame(x1, y1, w, h);
      }
    } else if (drag.mode === 'moveText') {
      clearOverlay();
      if (drag.moved && drag.hit >= 0 && points[drag.hit]) {
        var rectM2 = canvas.getBoundingClientRect();
        var ipM2 = screenToImage(e.clientX - rectM2.left, e.clientY - rectM2.top);
        pushUndo();
        points[drag.hit].x = Math.round((drag.origX + (ipM2.x - drag.startIx)) * 10) / 10;
        points[drag.hit].y = Math.round((drag.origY + (ipM2.y - drag.startIy)) * 10) / 10;
        afterDataChange();
      }
    } else if (drag.mode === 'resizeText') {
      clearOverlay();
      if (drag.moved && drag.hit >= 0 && points[drag.hit]) {
        var rectR2 = canvas.getBoundingClientRect();
        var anchorR2 = textAnchorScreen(points[drag.hit]);
        var distR2 = Math.hypot((e.clientX - rectR2.left) - anchorR2.x, (e.clientY - rectR2.top) - anchorR2.y);
        var newSize = clamp(drag.origSize * (distR2 / Math.max(1, drag.startDist)), 0.4, 6);
        pushUndo();
        points[drag.hit].size = Math.round(newSize * 100) / 100;
        afterDataChange();
      }
    } else if (drag.mode === 'text') {
      if (!drag.moved && !spaceDown) openTextModal(drag.startIx, drag.startIy);
    } else {
      var clicked = !drag.moved;
      if (clicked && !spaceDown && drag.mode === 'add') {
        var rect2 = canvas.getBoundingClientRect();
        var sx = e.clientX - rect2.left, sy = e.clientY - rect2.top;
        var p = screenToImage(sx, sy);
        if (p.x >= 0 && p.y >= 0 && p.x <= imgW && p.y <= imgH) {
          if (e.detail >= 2) {
            // 双击空白：撤销第一次单击误加的点，不新增点（颜色切换由 dblclick 处理）
            if (lastAddedIdx >= 0 && lastAddedIdx < points.length) deletePoint(lastAddedIdx);
            lastAddedIdx = -1;
          } else {
            addPoint(p.x, p.y);
            lastAddedIdx = points.length - 1;
          }
        }
      }
      commitPan();
    }
    drag = null;
  });
  canvas.addEventListener('pointercancel', function () {
    clearOverlay();
    commitPan();
    drag = null;
  });
  canvas.addEventListener('pointerleave', function () {
    clearHover();
  });
  canvas.addEventListener('dblclick', function (e) {
    if (!img) return;
    var rect = canvas.getBoundingClientRect();
    if (hitTest(e.clientX - rect.left, e.clientY - rect.top) === -1) {
      if (lastColor) setCurrentColor(lastColor);
    }
  });

  // 键盘：空格平移、Ctrl+Z 撤销、1-8 切换颜色、Delete 删除、H 显示/隐藏数字
  window.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    var inField = ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(tag) !== -1;
    if (e.code === 'Space' && !inField) {
      e.preventDefault();
      if (!spaceDown) { spaceDown = true; mainEl.classList.add('panning'); }
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      undo();
    }
    if (inField || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = parseInt(e.key, 10);
    if (k >= 1 && k <= 8) {
      var order = colorOrder();
      if (order[k - 1]) { e.preventDefault(); setCurrentColor(order[k - 1]); }
    } else if (e.key === 'Delete' || e.key === 'Backspace') {
      if (hoverIdx >= 0 && hoverIdx < points.length) {
        e.preventDefault();
        deletePoint(hoverIdx);
        clearHover();
      }
    } else if (e.key === 'h' || e.key === 'H') {
      e.preventDefault();
      toggleLabels();
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space') { spaceDown = false; mainEl.classList.remove('panning'); }
  });
  window.addEventListener('blur', function () {
    spaceDown = false;
    mainEl.classList.remove('panning');
    if (drag) { clearOverlay(); commitPan(); drag = null; }
  });

  window.addEventListener('resize', resizeCanvas);

  // ===== 初始化 =====
  loadSettings();
  refreshUI();
  resizeCanvas();
})();
</script>
</body>
</html>
